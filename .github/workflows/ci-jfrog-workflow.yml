name: Publish to LinkedIn JFrog

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'linkedin/zookeeper' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK 8
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Check release configuration
        run: python3 tools/ci/test_fork_build.py
      - name: Set LinkedIn release version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: sh .github/workflows/version-upgrade.sh "$RELEASE_VERSION"
      - name: Publish artifacts
        run: mvn -B -ntp clean deploy -DskipTests -s .github/workflows/settings.xml -DretryFailedDeploymentCount=3
        env:
          MVN_DEPLOY_JFROG_USER: ${{ secrets.MVN_DEPLOY_JFROG_USER }}
          MVN_DEPLOY_JFROG_KEY: ${{ secrets.MVN_DEPLOY_JFROG_KEY }}
